name: Daily Update index.html

on:
  schedule:
    # 每天 UTC 0:15 (北京时间 08:15) 运行
    - cron: '15 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch, Replace Domain and Compare
        run: |
          # 1. 下载远程最新文件
          curl -sL https://bestcf.pages.dev/index.html -o index.html.tmp

          # 2. 全量忽略大小写替换原作者域名为你的域名
          sed -i 's/bestcf\.pages\.dev/cyh1.eu.cc/gI' index.html.tmp

          # 3. 比对与覆盖
          if [ -f index.html ] && cmp -s index.html index.html.tmp; then
            echo "文件无变化，跳过提交。"
            rm index.html.tmp
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            echo "检测到更新，覆写本地文件。"
            mv index.html.tmp index.html
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          fi

      - name: Commit and Push Changes
        if: env.HAS_CHANGES == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add index.html
          git commit -m "chore: auto-update and enforce custom domain replace [skip ci]"
          git push
