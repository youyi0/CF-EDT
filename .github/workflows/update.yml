name: Daily Update index.html

on:
  schedule:
    # 每天 UTC 0:15 (北京时间 08:15) 运行
    - cron: '15 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch, Validate and Remove Obfuscated Redirect
        run: |
          # 1. 定义源站主地址与备用地址列表
          URLS=(
            "https://bestcf.pages.dev/index.html"
            "https://bestcf.eu.cc/index.html"
          )

          FETCH_SUCCESS=false

          # 2. 轮询尝试下载与多重校验
          for url in "${URLS[@]}"; do
            echo "正在尝试从 $url 下载..."
            
            # 下载文件
            if curl -sLf "$url" -o index.html.tmp; then
              # 检查是否为空文件
              if [ ! -s index.html.tmp ]; then
                echo "警告：从 $url 下载的文件为空，尝试下一个..."
                rm -f index.html.tmp
                continue
              fi

              # 校验关键内容特征（防伪装页/被篡改/被替换）
              if ! grep -q -i "Cloudflare EDT" index.html.tmp; then
                echo "警告：从 $url 获取的内容不符合特征（可能已变成伪装页），尝试下一个..."
                rm -f index.html.tmp
                continue
              fi

              echo "成功从 $url 获取并校验有效内容！"
              FETCH_SUCCESS=true
              break
            else
              echo "从 $url 下载失败（网络问题或 4xx/5xx），尝试下一个..."
              rm -f index.html.tmp
            fi
          done

          # 3. 如果所有地址均失败，安全退出
          if [ "$FETCH_SUCCESS" = false ]; then
            echo "错误：所有源站地址均无法获取有效内容，取消覆写。"
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
            exit 0
          fi

          # 4. 精准删除包含混淆跳转逻辑的那一行 script
          sed -i '/QmVzdENGLnBhZ2VzLmRldg==/d' index.html.tmp

          # 5. 比对与覆盖
          if [ -f index.html ] && cmp -s index.html index.html.tmp; then
            echo "文件无变化，跳过提交。"
            rm -f index.html.tmp
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            echo "检测到正常更新，覆写本地文件。"
            mv index.html.tmp index.html
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          fi

      - name: Commit and Push Changes
        if: env.HAS_CHANGES == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add index.html
          git commit -m "chore: auto-update and remove redirect script"
          git push
