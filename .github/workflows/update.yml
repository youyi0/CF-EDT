name: Daily Update index.html

on:
  schedule:
    # 每天 UTC 0:15 (北京时间 08:15) 运行
    - cron: '15 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch, Clean Redirects and Replace Domain
        run: |
          # 1. 下载远程最新文件
          curl -sL "https://bestcf.pages.dev/index.html" -o index.html.tmp

          # 2. 全量替换源域名为你自己的域名 (忽略大小写)
          sed -i 's/bestcf\.pages\.dev/cyh1.eu.cc/gI' index.html.tmp

          # 3. 移除/禁用代码中可能存在的 window.location 赋值跳转语句
          sed -i 's/window\.location\.href\s*=/;\/\/ window.location.href =/gI' index.html.tmp
          sed -i 's/window\.location\.replace/;\/\/ window.location.replace/gI' index.html.tmp
          sed -i 's/location\.href\s*=/;\/\/ location.href =/gI' index.html.tmp

          # 4. 比对与覆盖
          if [ -f index.html ] && cmp -s index.html index.html.tmp; then
            echo "文件无变化，跳过提交。"
            rm index.html.tmp
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            echo "检测到更新，覆写本地文件。"
            mv index.html.tmp index.html
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          fi

      - name: Commit and Push Changes
        if: env.HAS_CHANGES == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add index.html
          git commit -m "chore: auto-update and neutralize domain redirect [skip ci]"
          git push
